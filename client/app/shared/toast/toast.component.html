@if (displayedMessage().body) {
  <div class="alert" [ngClass]="'alert-' + displayedMessage().type" role="alert">
  <i class="fa me-2" [ngClass]="{
    'fa-check-circle': displayedMessage().type === 'success',
    'fa-exclamation-circle': displayedMessage().type === 'warning' || displayedMessage().type === 'danger'
  }"></i>
    <span [innerHTML]="displayedMessage().body"></span>
  </div>
}
